openapi: 3.0.3
info:
  title: Shopping Lists API
  description: >-
    API for managing shopping lists and their items. Every request must send a
    Bearer token, and each user only accesses their own lists.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local server
tags:
  - name: Lists
  - name: Items
  - name: Users
security:
  - bearerAuth: []
paths:
  /users:
    post:
      tags: [Users]
      summary: Create a user
      description: Create a new user with a username and password
      security: [] # No authentication required for user creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /lists:
    get:
      tags: [Lists]
      summary: Get all shopping lists
      responses:
        '200':
          description: All shopping lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Lists]
      summary: Create shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListCreate'
      responses:
        '201':
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Lists]
      summary: Get a shopping list by id
      responses:
        '200':
          description: The shopping list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Lists]
      summary: Update the name of a shopping list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListCreate'
      responses:
        '200':
          description: List updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Lists]
      summary: Delete a shopping list
      responses:
        '200':
          description: List deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /lists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Items]
      summary: Add item to list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /lists/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Items]
      summary: Partially update an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Items]
      summary: Remove item
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: User API token
  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: List or item not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          example: alice
        password:
          type: string
          format: password
          minLength: 1
          example: password123
    UserResponse:
      type: object
      properties:
        message:
          type: string
          example: User alice was created successfully.
        user:
          type: object
          properties:
            id:
              type: integer
              example: 4
            username:
              type: string
              example: alice
            apiToken:
              type: string
              format: uuid
              example: 75ea9010-65e4-4fa8-b13c-7c0348b16e12
    ShoppingListCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: "Grocery Shopping"
    ShoppingList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    ListResponse:
      type: object
      properties:
        message:
          type: string
          example: List with id 3 updated.
        list:
          $ref: '#/components/schemas/ShoppingList'
    ItemCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          default: 1
        bought:
          type: boolean
          default: false
    ItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        bought:
          type: boolean
    Item:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        bought:
          type: boolean
    ItemResponse:
      type: object
      properties:
        message:
          type: string
          example: Item with id 2 updated.
        item:
          $ref: '#/components/schemas/Item'
 